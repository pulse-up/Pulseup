<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Settings</title>

    <link rel="stylesheet" href="CSS folder/settings.css">
    <link rel="stylesheet" href="CSS folder/main.css">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


</head>

<body>

<nav class="navbar border-bottom px-4">
    <div class="container-fluid">
        <span class="fw-bold" style="color: var(--primary-blue);">Settings</span>
        <button onclick="goBack()" class="btn btn-outline-primary btn-sm">Back</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar (kept for consistency with other pages) -->
        <aside class="col-md-3 col-lg-2 bg-white border-end vh-100 p-3"></aside>

        <section class="col-md-9 col-lg-10 p-4">

            <h4 class="mb-4">General Settings</h4>

            <div class="card p-4 shadow-sm mb-4">
                <h6 class="text-muted mb-3">Profile Settings</h6>

                <div class="mb-3">
                    <label class="form-label">Display Name</label>
                    <input type="text" class="form-control" placeholder="Enter name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control">
                </div>

                <button class="btn btn-primary">Save Changes</button>
            </div>

            <div class="card p-4 shadow-sm mb-4">
                <h6 class="text-muted mb-3">Security</h6>

                <div class="mb-3">
                    <label class="form-label">Change Password</label>
                    <input type="password" class="form-control mb-2" placeholder="New password">
                    <input type="password" class="form-control" placeholder="Confirm password">
                </div>

                <button class="btn btn-warning">Update Password</button>
            </div>

            <div class="card p-4 shadow-sm mb-4">
                <h6 class="text-muted mb-3">Notifications</h6>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label">Email Notifications</label>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">SMS Alerts</label>
                </div>
            </div>

            <div class="card p-4 shadow-sm">
                <h6 class="text-muted mb-3">Appearance</h6>

                <button class="btn btn-outline-primary me-2" onclick="setTheme('light')">Light</button>
                <button class="btn btn-primary" onclick="setTheme('dark')">Dark</button>
            </div>

        </section>

    </div>
</div>

<script>
    function setTheme(mode) {
        document.documentElement.setAttribute("data-bs-theme", mode);
    }

    function goBack() {
        window.history.back();
    }
</script>

</body>
</html>
