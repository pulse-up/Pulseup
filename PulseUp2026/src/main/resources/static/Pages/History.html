<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Consultation History</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0b3c66;
            --secondary-blue: #125489;
            --light-bg: #f4f6f9;
            --card-bg: #ffffff;
            --border-light: #e8edf3;
            --text-dark: #1f2d3d;
            --text-muted: #7b8794;
            --success-green: #28c76f;
            --danger-red: #ea5455;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
        }

        /* NAVBAR */
        .navbar {
            background-color: white !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .navbar-brand span {
            color: var(--primary-blue);
        }

        /* SIDEBAR */
        aside {
            background-color: white;
        }

        .nav-link {
            border-radius: 10px;
            padding: 10px 14px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background-color: #edf5fc;
        }

        .nav-link.active {
            background-color: var(--primary-blue) !important;
            color: white !important;
        }

        /* CARDS */
        .card {
            border: none;
            border-radius: 18px;
            background-color: var(--card-bg);
        }

        .shadow-sm {
            box-shadow: 0 6px 18px rgba(0,0,0,0.05) !important;
        }

        /* BUTTONS */
        .btn-primary {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background-color: var(--secondary-blue);
        }

        /* INPUTS */
        .form-control,
        .form-select {
            border-radius: 10px;
            border: 1px solid var(--border-light);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 0.2rem rgba(11, 60, 102, 0.1);
        }

        /* BADGES */
        .badge.bg-success {
            background-color: var(--success-green) !important;
        }

        .badge.bg-danger {
            background-color: var(--danger-red) !important;
        }

        .badge.bg-secondary {
            background-color: #6c757d !important;
        }

        /* TABLE */
        .table thead {
            background-color: #f8fafc;
        }

        /* LINKS */
        a {
            color: var(--primary-blue);
        }

        a:hover {
            color: var(--secondary-blue);
        }

        /* FOOTER */
        footer {
            background-color: white;
            border-top: 1px solid var(--border-light);
        }

    </style>
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg border-bottom px-4">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                <img src="Logo.jpeg" class="rounded-circle" style="height: 60px;">
                <span>History Page</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <input class="form-control rounded-pill" type="search" placeholder="Search history..." style="width: 250px;">
                <a href="settings.html" class="text-dark">
                    <i class="bi bi-gear"></i>
                </a>
                <i class="bi bi-bell"></i>
                <img src="#" class="rounded-circle" style="height: 40px;">
            </div>

        </div>
    </nav>
</header>

<main class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-2 border-end vh-100 p-3">

            <ul class="nav flex-column gap-2">
                <li><a class="nav-link text-dark" href="Profile.html">Profile</a></li>
                <li><a class="nav-link text-dark" href="Appointments.html">Bookings</a></li>
                <li><a class="nav-link text-dark" href="Healthquest.html">Healthquests</a></li>
                <li><a class="nav-link text-dark" href="Sicknote.html">Sick Notes</a></li>
                <li><a class="nav-link active" href="#">History</a></li>
            </ul>

            <div class="position-absolute bottom-0 mb-4">
                <a href="#" class="text-muted text-decoration-none">Logout</a>
            </div>

        </aside>

        <!-- Main -->
        <section class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h4 class="mb-0">Consultation History</h4>

                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm" style="width: 150px;">
                        <option selected>Status</option>
                        <option>Attended</option>
                        <option>Cancelled</option>
                        <option>No-show</option>
                    </select>

                    <input type="date" class="form-control form-control-sm">
                </div>

            </div>

            <div class="card shadow-sm p-3">

                <div class="table-responsive">
                    <table class="table align-middle">

                        <thead>
                        <tr>
                            <th>Consultation</th>
                            <th>Doctor / Clinic</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="item : ${history}">

                            <td>
                                <strong th:text="${item.type}">General Consultation</strong><br>
                                <small class="text-muted" th:text="${item.category}">Health Clearance</small>
                            </td>

                            <td th:text="${item.doctor}">Dr. van der Merwe</td>

                            <td th:text="${item.date}">Feb 24, 2026</td>

                            <td>
                                <span class="badge bg-success" th:if="${item.status == 'Attended'}">Attended</span>
                                <span class="badge bg-danger" th:if="${item.status == 'Cancelled'}">Cancelled</span>
                                <span class="badge bg-secondary" th:if="${item.status == 'No-show'}">No-show</span>
                            </td>

                            <td>
                                <a href="#" class="text-decoration-none">View</a>
                            </td>

                        </tr>

                        </tbody>

                    </table>
                </div>

            </div>

        </section>

    </div>
</main>

<footer class="text-center py-3 text-muted small">
    © 2026 PulseUp Clinical System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
